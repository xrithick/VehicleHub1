<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vehicle Details - VehicleHub</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" type="image/svg+xml" href="assets/images/logo.svg">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <!-- Header -->
  <header class="header">
    <div class="nav-container">
      <a href="dashboard.html" class="brand-logo">
        <span class="brand-icon">🚘</span> Vehicle<span>Hub</span>
      </a>
      <button class="menu-toggle" id="menu-toggle" aria-label="Toggle Menu">☰</button>
      <ul class="nav-links" id="nav-links">
        <li><a href="dashboard.html">Home</a></li>
        <li><a href="cars.html">Cars</a></li>
        <li><a href="bikes.html">Bikes</a></li>
        <li><a href="compare.html">Compare</a></li>
        <li><a href="favorites.html">Favorites</a></li>
        <li id="nav-user-info" class="nav-user"></li>
      </ul>
    </div>
  </header>

  <!-- Main Content -->
  <main class="main-content">
    <!-- Back Button -->
    <div style="margin-bottom: 1.25rem;">
      <a href="javascript:history.back()" class="btn btn-secondary btn-sm" id="btn-back">
        &larr; Back to Listings
      </a>
    </div>

    <!-- Vehicle Container (Populated dynamically) -->
    <div id="vehicle-details-root">
      <div style="text-align: center; padding: 4rem; color: var(--text-muted);">
        Loading vehicle specifications...
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="footer">
    <div class="footer-content">
      <p><strong>VehicleHub</strong> &copy; 2026 – MCA Academic Project</p>
      <div class="footer-links">
        <a href="dashboard.html">Dashboard</a>
        <a href="cars.html">Cars</a>
        <a href="bikes.html">Bikes</a>
        <a href="compare.html">Compare</a>
        <a href="favorites.html">Favorites</a>
      </div>
    </div>
  </footer>

  <!-- Scripts -->
  <script src="js/supabase.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/vehicles.js"></script>
  <script src="js/favorites.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", async () => {
      // Mobile Toggle
      const toggle = document.getElementById("menu-toggle");
      const navLinks = document.getElementById("nav-links");
      if (toggle && navLinks) {
        toggle.addEventListener("click", () => navLinks.classList.toggle("show"));
      }

      // Auth Guard
      const currentUser = await requireAuth();
      if (!currentUser) return;

      // Parse ID and type from URL parameters
      const urlParams = new URLSearchParams(window.location.search);
      const vehicleId = urlParams.get("id");
      const vehicleType = urlParams.get("type");

      const root = document.getElementById("vehicle-details-root");

      if (!vehicleId) {
        root.innerHTML = `
          <div class="empty-state">
            <div class="empty-state-icon">⚠️</div>
            <h3>No Vehicle Selected</h3>
            <p>Please select a vehicle from the Cars or Bikes catalogue to view specifications.</p>
            <a href="cars.html" class="btn btn-primary">Browse Cars</a>
          </div>
        `;
        return;
      }

      // Fetch vehicle details
      const vehicle = await VehicleService.getVehicleById(vehicleId, vehicleType);

      if (!vehicle) {
        root.innerHTML = `
          <div class="empty-state">
            <div class="empty-state-icon">❓</div>
            <h3>Vehicle Not Found</h3>
            <p>Unable to load vehicle details for ID: ${vehicleId}</p>
            <a href="dashboard.html" class="btn btn-secondary">Go to Dashboard</a>
          </div>
        `;
        return;
      }

      // Check if already favorited
      const isFav = await FavoritesService.isFavorite(currentUser.id, vehicle.id);

      // Render spec rows (only if values exist)
      const specRows = [
        { label: "Brand", val: vehicle.brand },
        { label: "Model", val: vehicle.model },
        { label: "Vehicle Type", val: vehicle.type === "car" ? "Car" : "Bike / Motorcycle" },
        { label: "Engine Displacement", val: vehicle.engine },
        { label: "Fuel Type", val: vehicle.fuel },
        { label: "Mileage", val: vehicle.mileage },
        { label: "Transmission", val: vehicle.transmission },
        { label: "Max Power", val: vehicle.power },
        { label: "Max Torque", val: vehicle.torque },
        { label: "Seating Capacity", val: vehicle.seating },
        { label: "Body Type / Style", val: vehicle.bodyType },
        { label: "Fuel Tank Capacity", val: vehicle.fuelTank },
        { label: "Ground Clearance", val: vehicle.groundClearance }
      ];

      const specsHtml = specRows
        .filter(item => Boolean(item.val))
        .map(item => `
          <div class="spec-row">
            <span class="spec-row-key">${item.label}</span>
            <span class="spec-row-val">${item.val}</span>
          </div>
        `).join("");

      root.innerHTML = `
        <div class="details-container">
          <!-- Header Area -->
          <div class="details-header">
            <div>
              <span class="vehicle-brand">${vehicle.brand}</span>
              <h1>${vehicle.brand} ${vehicle.model}</h1>
              <p style="color: var(--text-muted); margin-top: 0.25rem;">
                ${vehicle.bodyType || ''} &bull; ${vehicle.fuel} &bull; ${vehicle.engine}
              </p>
            </div>
            <div class="details-price-badge">
              ${vehicle.price}
            </div>
          </div>

          <!-- Content Grid: Image + Specs -->
          <div class="details-content-grid">
            <div class="details-gallery">
              <img 
                src="${vehicle.imageUrl}" 
                alt="${vehicle.brand} ${vehicle.model}" 
                class="details-main-img" 
                onerror="this.src='https://images.unsplash.com/photo-1533473359331-0135ef1b58bf?auto=format&fit=crop&w=800&q=80'" 
              />
              ${vehicle.description ? `
                <div style="background: #ffffff; padding: 1.25rem; border-radius: 8px; border: 1px solid var(--border); font-size: 0.95rem; color: var(--slate);">
                  <strong style="display:block; margin-bottom: 0.35rem; color: var(--secondary);">Overview:</strong>
                  ${vehicle.description}
                </div>
              ` : ''}
            </div>

            <!-- Specs Table -->
            <div>
              <h3 style="margin-bottom: 0.75rem; color: var(--secondary); font-size: 1.2rem;">
                Technical Specifications
              </h3>
              <div class="details-specs-list">
                ${specsHtml}
              </div>
            </div>
          </div>

          <!-- Actions Bar -->
          <div class="details-actions-bar">
            <button id="btn-toggle-fav" class="btn ${isFav ? 'btn-danger' : 'btn-primary'}">
              ${isFav ? '❤️ Remove from Favorites' : '🤍 Add to Favorites'}
            </button>
            <a href="compare.html?v1=${vehicle.id}" class="btn btn-secondary">
              ⚖️ Compare this Vehicle
            </a>
            <a href="${vehicle.type === 'car' ? 'cars.html' : 'bikes.html'}" class="btn btn-secondary" style="margin-left: auto;">
              Explore More ${vehicle.type === 'car' ? 'Cars' : 'Bikes'}
            </a>
          </div>
        </div>
      `;

      // Update Back button text specifically
      const backBtn = document.getElementById("btn-back");
      if (backBtn) {
        backBtn.innerText = `&larr; Back to ${vehicle.type === 'car' ? 'Cars' : 'Bikes'}`;
        backBtn.href = vehicle.type === 'car' ? 'cars.html' : 'bikes.html';
      }

      // Add to Favorites action
      const favBtn = document.getElementById("btn-toggle-fav");
      if (favBtn) {
        favBtn.addEventListener("click", async () => {
          const currentlyFav = await FavoritesService.isFavorite(currentUser.id, vehicle.id);
          if (currentlyFav) {
            await FavoritesService.removeFavorite(currentUser.id, vehicle.id);
            favBtn.className = "btn btn-primary";
            favBtn.innerHTML = "🤍 Add to Favorites";
          } else {
            await FavoritesService.addFavorite(currentUser.id, vehicle);
            favBtn.className = "btn btn-danger";
            favBtn.innerHTML = "❤️ Remove from Favorites";
          }
        });
      }
    });
  </script>
</body>
</html>
