<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cars - VehicleHub</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" type="image/svg+xml" href="assets/images/logo.svg">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <!-- Header -->
  <header class="header">
    <div class="nav-container">
      <a href="dashboard.html" class="brand-logo">
        <span class="brand-icon">🚘</span> Vehicle<span>Hub</span>
      </a>
      <button class="menu-toggle" id="menu-toggle" aria-label="Toggle Menu">☰</button>
      <ul class="nav-links" id="nav-links">
        <li><a href="dashboard.html">Home</a></li>
        <li><a href="cars.html" class="active">Cars</a></li>
        <li><a href="bikes.html">Bikes</a></li>
        <li><a href="compare.html">Compare</a></li>
        <li><a href="favorites.html">Favorites</a></li>
        <li id="nav-user-info" class="nav-user"></li>
      </ul>
    </div>
  </header>

  <!-- Main Content -->
  <main class="main-content">
    <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; margin-bottom: 1rem;">
      <div>
        <h1 style="font-size: 1.85rem; color: var(--secondary);">Explore Cars 🚗</h1>
        <p style="color: var(--text-muted);">Find car specifications, prices, mileage, and features</p>
      </div>
      <div id="api-status-badge"></div>
    </div>

    <!-- Search & Filter Panel -->
    <div class="search-filter-panel">
      <div class="search-row">
        <!-- Search input -->
        <div class="form-group">
          <label class="form-label" for="search-input">Search Brand or Model</label>
          <input 
            type="text" 
            id="search-input" 
            class="form-control" 
            placeholder="e.g. Fortuner, Creta, City..." 
          />
        </div>

        <!-- Brand dropdown -->
        <div class="form-group">
          <label class="form-label" for="brand-select">Brand</label>
          <select id="brand-select" class="form-control">
            <option value="all">All Brands</option>
          </select>
        </div>

        <!-- Fuel dropdown -->
        <div class="form-group">
          <label class="form-label" for="fuel-select">Fuel Type</label>
          <select id="fuel-select" class="form-control">
            <option value="all">All Fuels</option>
            <option value="Petrol">Petrol</option>
            <option value="Diesel">Diesel</option>
          </select>
        </div>

        <!-- Reset button -->
        <div class="form-group" style="align-self: flex-end;">
          <button type="button" id="btn-reset-filters" class="btn btn-secondary">
            Reset
          </button>
        </div>
      </div>
    </div>

    <!-- Vehicle Count Info -->
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.25rem;">
      <span id="vehicle-count-text" style="font-size: 0.9rem; color: var(--text-muted); font-weight: 500;">
        Showing all cars
      </span>
    </div>

    <!-- Car Cards Grid -->
    <div class="vehicle-grid" id="cars-grid">
      <div style="text-align: center; grid-column: 1 / -1; padding: 3rem; color: var(--text-muted);">
        Loading cars...
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="footer">
    <div class="footer-content">
      <p><strong>VehicleHub</strong> &copy; 2026 – MCA Academic Project</p>
      <div class="footer-links">
        <a href="dashboard.html">Dashboard</a>
        <a href="cars.html">Cars</a>
        <a href="bikes.html">Bikes</a>
        <a href="compare.html">Compare</a>
        <a href="favorites.html">Favorites</a>
      </div>
    </div>
  </footer>

  <!-- Scripts -->
  <script src="js/supabase.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/vehicles.js"></script>
  <script src="js/favorites.js"></script>
  <script>
    let allCars = [];
    let currentUser = null;

    document.addEventListener("DOMContentLoaded", async () => {
      // Mobile Toggle
      const toggle = document.getElementById("menu-toggle");
      const navLinks = document.getElementById("nav-links");
      if (toggle && navLinks) {
        toggle.addEventListener("click", () => navLinks.classList.toggle("show"));
      }

      // Auth Guard
      currentUser = await requireAuth();
      if (!currentUser) return;

      // Fetch Cars
      const { vehicles, isLiveApi, sourceLabel } = await VehicleService.getVehicles("car");
      allCars = vehicles;

      // Data source status badge
      const statusBadge = document.getElementById("api-status-badge");
      if (statusBadge) {
        statusBadge.innerHTML = `
          <div class="api-indicator ${isLiveApi ? 'api-live' : 'api-fallback'}">
            <span class="api-dot"></span>
            <strong>Data Source:</strong> ${sourceLabel}
          </div>
        `;
      }

      // Populate Brand Dropdown
      const brandSelect = document.getElementById("brand-select");
      const brands = VehicleService.getDistinctBrands(allCars);
      brands.forEach(brand => {
        const opt = document.createElement("option");
        opt.value = brand;
        opt.innerText = brand;
        brandSelect.appendChild(opt);
      });

      // Render all cars
      renderCars(allCars);

      // Filter events
      const searchInput = document.getElementById("search-input");
      const fuelSelect = document.getElementById("fuel-select");
      const resetBtn = document.getElementById("btn-reset-filters");

      const applyFilters = () => {
        const query = searchInput.value;
        const brand = brandSelect.value;
        const fuel = fuelSelect.value;
        const filtered = VehicleService.filterVehicles(allCars, { query, brand, fuel });
        renderCars(filtered);
      };

      searchInput.addEventListener("input", applyFilters);
      brandSelect.addEventListener("change", applyFilters);
      fuelSelect.addEventListener("change", applyFilters);

      resetBtn.addEventListener("click", () => {
        searchInput.value = "";
        brandSelect.value = "all";
        fuelSelect.value = "all";
        renderCars(allCars);
      });
    });

    async function renderCars(cars) {
      const grid = document.getElementById("cars-grid");
      const countText = document.getElementById("vehicle-count-text");
      if (!grid) return;

      countText.innerText = `Showing ${cars.length} of ${allCars.length} cars`;

      if (cars.length === 0) {
        grid.innerHTML = `
          <div class="empty-state" style="grid-column: 1 / -1;">
            <div class="empty-state-icon">🔍</div>
            <h3>No Cars Found</h3>
            <p>Try searching with another keyword or resetting the filters.</p>
          </div>
        `;
        return;
      }

      grid.innerHTML = "";
      for (const car of cars) {
        const isFav = await FavoritesService.isFavorite(currentUser.id, car.id);
        const card = document.createElement("div");
        card.className = "vehicle-card";
        card.innerHTML = `
          <div class="vehicle-card-img-wrapper">
            <img src="${car.imageUrl}" alt="${car.brand} ${car.model}" class="vehicle-card-img" onerror="this.src='https://images.unsplash.com/photo-1533473359331-0135ef1b58bf?auto=format&fit=crop&w=800&q=80'" />
            <span class="vehicle-type-tag">${car.bodyType || "Car"}</span>
            <button class="btn-favorite-card ${isFav ? 'active' : ''}" data-id="${car.id}" title="${isFav ? 'Remove Favorite' : 'Add to Favorite'}">
              ${isFav ? '❤️' : '🤍'}
            </button>
          </div>
          <div class="vehicle-card-body">
            <div class="vehicle-brand">${car.brand}</div>
            <h3 class="vehicle-title">${car.model}</h3>
            <div class="vehicle-price">${car.price}</div>
            
            <div class="vehicle-specs-summary">
              <div class="spec-item">
                <span class="spec-item-label">Fuel</span>
                <span class="spec-item-value">${car.fuel}</span>
              </div>
              <div class="spec-item">
                <span class="spec-item-label">Engine</span>
                <span class="spec-item-value">${car.engine}</span>
              </div>
              <div class="spec-item">
                <span class="spec-item-label">Mileage</span>
                <span class="spec-item-value">${car.mileage}</span>
              </div>
              <div class="spec-item">
                <span class="spec-item-label">Transmission</span>
                <span class="spec-item-value">${car.transmission}</span>
              </div>
            </div>

            <div class="vehicle-card-actions">
              <a href="vehicle.html?id=${car.id}" class="btn btn-primary btn-sm btn-block">View Details</a>
              <a href="compare.html?v1=${car.id}" class="btn btn-secondary btn-sm" title="Compare this car">⚖️</a>
            </div>
          </div>
        `;

        const favBtn = card.querySelector(".btn-favorite-card");
        if (favBtn) {
          favBtn.addEventListener("click", async (e) => {
            e.stopPropagation();
            await FavoritesService.toggleFavorite(currentUser.id, car, favBtn);
          });
        }

        grid.appendChild(card);
      }
    }
  </script>
</body>
</html>
