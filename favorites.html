<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Favorites - VehicleHub</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" type="image/svg+xml" href="assets/images/logo.svg">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <!-- Header -->
  <header class="header">
    <div class="nav-container">
      <a href="dashboard.html" class="brand-logo">
        <span class="brand-icon">🚘</span> Vehicle<span>Hub</span>
      </a>
      <button class="menu-toggle" id="menu-toggle" aria-label="Toggle Menu">☰</button>
      <ul class="nav-links" id="nav-links">
        <li><a href="dashboard.html">Home</a></li>
        <li><a href="cars.html">Cars</a></li>
        <li><a href="bikes.html">Bikes</a></li>
        <li><a href="compare.html">Compare</a></li>
        <li><a href="favorites.html" class="active">Favorites</a></li>
        <li id="nav-user-info" class="nav-user"></li>
      </ul>
    </div>
  </header>

  <!-- Main Content -->
  <main class="main-content">
    <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; margin-bottom: 1.5rem;">
      <div>
        <h1 style="font-size: 1.85rem; color: var(--secondary);">Saved Favorites ❤️</h1>
        <p style="color: var(--text-muted);">Your personalized shortlist of cars and bikes</p>
      </div>
      <div id="favorites-count-badge"></div>
    </div>

    <!-- Favorites Grid -->
    <div class="vehicle-grid" id="favorites-grid">
      <div style="text-align: center; grid-column: 1 / -1; padding: 3rem; color: var(--text-muted);">
        Loading saved favorites...
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="footer">
    <div class="footer-content">
      <p><strong>VehicleHub</strong> &copy; 2026 – MCA Academic Project</p>
      <div class="footer-links">
        <a href="dashboard.html">Dashboard</a>
        <a href="cars.html">Cars</a>
        <a href="bikes.html">Bikes</a>
        <a href="compare.html">Compare</a>
        <a href="favorites.html">Favorites</a>
      </div>
    </div>
  </footer>

  <!-- Scripts -->
  <script src="js/supabase.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/vehicles.js"></script>
  <script src="js/favorites.js"></script>
  <script>
    let currentUser = null;

    document.addEventListener("DOMContentLoaded", async () => {
      // Mobile Toggle
      const toggle = document.getElementById("menu-toggle");
      const navLinks = document.getElementById("nav-links");
      if (toggle && navLinks) {
        toggle.addEventListener("click", () => navLinks.classList.toggle("show"));
      }

      // Auth Guard
      currentUser = await requireAuth();
      if (!currentUser) return;

      loadFavorites();
    });

    async function loadFavorites() {
      const grid = document.getElementById("favorites-grid");
      const countBadge = document.getElementById("favorites-count-badge");
      if (!grid) return;

      const favs = await FavoritesService.getFavorites(currentUser.id);

      if (countBadge) {
        countBadge.innerHTML = `
          <span style="font-size: 0.9rem; font-weight: 600; color: var(--slate); background: #ffffff; border: 1px solid var(--border); padding: 0.4rem 0.8rem; border-radius: 20px;">
            ${favs.length} ${favs.length === 1 ? 'vehicle' : 'vehicles'} saved
          </span>
        `;
      }

      if (favs.length === 0) {
        grid.innerHTML = `
          <div class="empty-state" style="grid-column: 1 / -1;">
            <div class="empty-state-icon">🤍</div>
            <h3>No Favorites Saved Yet</h3>
            <p>You haven't added any vehicles to your favorites. Explore our collection of cars and bikes to save your preferred models.</p>
            <div style="display: flex; gap: 0.75rem; justify-content: center; margin-top: 1rem;">
              <a href="cars.html" class="btn btn-primary">Browse Cars 🚗</a>
              <a href="bikes.html" class="btn btn-secondary">Browse Bikes 🏍️</a>
            </div>
          </div>
        `;
        return;
      }

      grid.innerHTML = "";
      favs.forEach(fav => {
        const card = document.createElement("div");
        card.className = "vehicle-card";
        card.innerHTML = `
          <div class="vehicle-card-img-wrapper">
            <img src="${fav.image_url}" alt="${fav.brand} ${fav.model}" class="vehicle-card-img" onerror="this.src='https://images.unsplash.com/photo-1533473359331-0135ef1b58bf?auto=format&fit=crop&w=800&q=80'" />
            <span class="vehicle-type-tag">${fav.vehicle_type === 'car' ? '🚗 Car' : '🏍️ Bike'}</span>
            <button class="btn-favorite-card active" data-id="${fav.vehicle_id}" title="Remove from Favorites">
              ❤️
            </button>
          </div>
          <div class="vehicle-card-body">
            <div class="vehicle-brand">${fav.brand}</div>
            <h3 class="vehicle-title">${fav.model}</h3>
            <div class="vehicle-price">${fav.price || 'N/A'}</div>

            <div class="vehicle-card-actions" style="margin-top: 1rem;">
              <a href="vehicle.html?id=${fav.vehicle_id}" class="btn btn-primary btn-sm btn-block">
                View Details
              </a>
              <a href="compare.html?v1=${fav.vehicle_id}" class="btn btn-secondary btn-sm" title="Compare">
                ⚖️
              </a>
              <button class="btn btn-danger btn-sm btn-remove-fav" title="Delete from favorites">
                🗑️
              </button>
            </div>
          </div>
        `;

        // Remove listener from both heart icon and trash button
        const removeBtns = [card.querySelector(".btn-favorite-card"), card.querySelector(".btn-remove-fav")];
        removeBtns.forEach(btn => {
          if (btn) {
            btn.addEventListener("click", async (e) => {
              e.stopPropagation();
              await FavoritesService.removeFavorite(currentUser.id, fav.vehicle_id);
              loadFavorites();
            });
          }
        });

        grid.appendChild(card);
      });
    }
  </script>
</body>
</html>
